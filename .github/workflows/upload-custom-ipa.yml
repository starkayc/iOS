name: Upload Custom IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name (e.g. Balatro)"
        required: true
      version:
        description: "Version (e.g. 1.0)"
        required: true
      download_link:
        description: "Direct download link to the .ipa"
        required: true
      localized_description:
        description: "App description shown in AltStore (optional — blank is fine)"
        required: false
        default: ""
      subtitle:
        description: "Subtitle shown under the app name (optional — blank is fine)"
        required: false
        default: ""

# All three workflows share one group so runs queue instead of racing
# each other on repo.json, current_releases.json and the release.
concurrency:
  group: altstore-repo
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Workflow inputs are attacker-controllable, so they are passed to
      # the script through the environment — never interpolated straight
      # into the run script (which would allow shell injection).
      - name: Download, validate, update and sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: ${{ inputs.app_name }}
          APP_VERSION: ${{ inputs.version }}
          APP_URL: ${{ inputs.download_link }}
          APP_DESCRIPTION: ${{ inputs.localized_description }}
          APP_SUBTITLE: ${{ inputs.subtitle }}
        run: |
          python scripts/add_custom_ipa.py \
            --name="$APP_NAME" \
            --version="$APP_VERSION" \
            --url="$APP_URL" \
            --description="$APP_DESCRIPTION" \
            --subtitle="$APP_SUBTITLE" \
            --token="$GH_TOKEN"

      - name: Commit and push changes
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add repo.json icons/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: add custom IPA ${APP_NAME} (rel-${APP_VERSION})" -m "Automated upload from GitHub Actions."

          # Push with rebase retries — safety net against concurrent
          # commits from the other workflows.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
            sleep 5
          done
          exit 1

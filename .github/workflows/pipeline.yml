name: Pipeline

# Jobs, not separate workflows: a push made with GITHUB_TOKEN never
# starts another workflow run, so chaining across files did not fire.

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: altstore-source-write-lock
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Byte-compile all scripts
        run: python -m compileall -q scripts

      - name: Run pipeline selftest
        run: python scripts/selftest.py

  check-releases:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check for updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_releases.py --token="$GH_TOKEN"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add current_releases.json

          if git diff --cached --quiet; then
            echo "No version changes."
            exit 0
          fi

          git commit -m "chore: update current releases" -m "Automated update from GitHub Actions."
          bash scripts/ci_push.sh

  update-source:
    needs: check-releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}

    steps:
      # ref: master, not github.sha: the check-releases job committed
      # current_releases.json a moment ago and this job must see it.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Update source (fetch changed apps)
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_source.py --github-token="$GH_TOKEN"

      - name: Sync IPA Assets release
        id: sync
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: |
          extra=""
          if [ "$UPDATE_OUTCOME" != success ]; then extra=--no-delete; fi
          python scripts/sync_release.py --token="$GH_TOKEN" $extra

      # A failed upload must not publish the pointer: repo.json would name
      # an asset that never landed and every client's update would 404.
      - name: Commit and push changes
        id: commit
        if: always() && steps.sync.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add repo.json icons/ current_releases.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update AltStore source" -m "Automated update from GitHub Actions."
          bash scripts/ci_push.sh
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  pages:
    needs: update-source
    # The push already rebuilds Pages (served from branch master), but the
    # Pages builder sometimes skips GITHUB_TOKEN pushes, so ask anyway.
    if: needs.update-source.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
    continue-on-error: true

    steps:
      - name: Trigger Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /dev/null -w 'pages build request: %{http_code}\n' \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"

name: Update AltStore Source

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    # Uses minute 17 to avoid the :00/:30 stampede.
    - cron: "17 */6 * * *"
  push:
    paths:
      - "current_releases.json"
      - "scripts/**"
      - "sources.json"
      - ".github/workflows/update-source.yml"
  workflow_dispatch:

# All three workflows share one group so runs queue instead of racing
# each other on repo.json, current_releases.json and the release.
concurrency:
  group: altstore-repo
  cancel-in-progress: false

jobs:
  update-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update source (fetch changed apps)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_source.py --github-token="$GH_TOKEN"

      - name: Sync IPA Assets release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Deterministic sync: creates the release if needed, uploads
          # every ipas/*.ipa (missing or size-changed), deletes stale
          # .ipa assets (exact-name API matching — no shell word
          # splitting, no gh fuzzy matching), and fails if the release
          # doesn't match ipas/ afterwards.
          python scripts/sync_release.py --token="$GH_TOKEN"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add repo.json icons/ current_releases.json

          # Only commit if there's something to commit.
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update AltStore source" -m "Automated update from GitHub Actions."

          # Push with rebase retries — safety net against concurrent
          # commits from the other workflows.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
            sleep 5
          done
          exit 1
